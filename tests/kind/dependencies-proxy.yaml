# Test fixture only: an SSH server that Remote Execution logs in to. It trusts
# the public key from the ssh-target Secret (created by proxy-ssh.sh) for the
# image's unprivileged user "abc" on port 2222. sshd runs as that user, with a
# host key generated at start, so the pod meets the restricted Pod Security
# profile; it can only log in that user.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssh-target
  labels:
    app.kubernetes.io/name: ssh-target
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ssh-target
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ssh-target
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 911
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sshd
          image: ghcr.io/linuxserver/openssh-server:version-10.3_p1-r2@sha256:7bd52bcb55b7cfbdae80c756403f37652b05b86b240f73a44f07ce40ac2692bf
          command:
            - /bin/sh
            - -ec
            - |
              ssh-keygen -q -t ed25519 -N "" -f /run/sshd/host_ed25519
              cat >/run/sshd/sshd_config <<EOF
              Port 2222
              HostKey /run/sshd/host_ed25519
              PidFile none
              AuthorizedKeysFile /keys/authorized_keys
              StrictModes no
              PasswordAuthentication no
              KbdInteractiveAuthentication no
              UsePAM no
              SshdSessionPath /usr/lib/ssh/sshd-session.pam
              SshdAuthPath /usr/lib/ssh/sshd-auth.pam
              EOF
              exec /usr/sbin/sshd.pam -D -e -f /run/sshd/sshd_config
          ports:
            - name: ssh
              containerPort: 2222
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          readinessProbe:
            tcpSocket:
              port: ssh
            periodSeconds: 5
          volumeMounts:
            - name: keys
              mountPath: /keys
              readOnly: true
            - name: run
              mountPath: /run/sshd
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: keys
          secret:
            secretName: ssh-target
        - name: run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ssh-target
  labels:
    app.kubernetes.io/name: ssh-target
spec:
  selector:
    app.kubernetes.io/name: ssh-target
  ports:
    - name: ssh
      port: 2222
      targetPort: ssh
