# A Smart Proxy with content (a capsule) for a Foreman server that runs the
# Katello plugin: its own Pulp, an httpd front door and foreman-proxy with the
# Registration, Templates, Dynflow and Logs modules, and optionally Remote
# Execution, Ansible and the container gateway. It syncs content from the
# Foreman server's Pulp and forwards the subscription requests (/rhsm) of its
# hosts to the Foreman server.

# Host name of the Smart Proxy, required. Hosts and the Foreman server reach it
# by this name, on ports 443 (httpd) and 8443 (foreman-proxy) of the same
# Service. It is the name of both Smart Proxy records in Foreman, <name> and
# <name>-pulp, and must be in the server certificate and be the CN of the
# client certificate in the bundle Secret.
name: ""
# More host names httpd and foreman-proxy answer to. Each must be in the
# server certificate.
serverAliases: []

imagePullSecrets: []

# A PodDisruptionBudget (PDB) with maxUnavailable for each workload with more
# than one replica, so that draining a node evicts its replicas one at a time:
# httpd, and the Pulp Deployments with S3 storage or
# pulp.storage.colocate=false. With colocated filesystem storage every Pulp pod
# must run on one node, so a budget would block the drain of that node.
# unhealthyPodEvictionPolicy is AlwaysAllow, so pods that are not ready never
# block a drain. foreman-proxy always runs one replica.
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

# Spread the replicas of the same workloads across nodes. ScheduleAnyway
# makes it a preference: pods still start when there are fewer nodes than
# replicas.
topologySpread:
  enabled: true
  topologyKey: kubernetes.io/hostname
  maxSkew: 1
  whenUnsatisfiable: ScheduleAnyway
nameOverride: ""
fullnameOverride: ""

# Extra /etc/hosts entries for every pod of the release, in the pod
# hostAliases format ([{ip: 192.0.2.10, hostnames: [foreman.example.test]}]).
# Use it when the host name of foreman.url or of the Foreman server's Pulp URL
# is not in the cluster DNS.
hostAliases: []

foreman:
  # URL of the Foreman server, required, for example
  # https://foreman.example.test. httpd forwards /rhsm and the other Foreman
  # paths there, foreman-proxy calls it, and the registration Job uses its API.
  # The server certificate behind it must be signed by server-ca.crt from the
  # bundle Secret.
  url: ""
  # Client certificate common names (CN) of the Foreman server. foreman-proxy
  # accepts calls from them and httpd maps them to the Pulp administrator, so
  # that Katello can manage this Pulp. Empty means the host name of url, which
  # is the CN of the client certificate the foreman chart uses.
  clientNames: []

# The identity of this Smart Proxy, in one Secret in the release namespace.
# tools/foreman-proxy-bundle.sh builds it from the Foreman release and the
# certificates issued for this Smart Proxy. Keys:
#   ca.crt                  CA bundle of the Foreman server; httpd and
#                           foreman-proxy verify client certificates with it
#   server-ca.crt           CA of the Foreman server's HTTPS certificate,
#                           published as /pub/katello-server-ca.crt
#   tls.crt, tls.key        server certificate for name and serverAliases
#   client.crt, client.key  client certificate, CN = name; presented to the
#                           Foreman server
#   oauth-consumer-key, oauth-consumer-secret
#                           OAuth consumer of the Foreman server
#                           (foreman.oauth.existingSecret of the foreman chart);
#                           read only by the registration Job
bundle:
  # Default <release>-bundle.
  secretName: ""

# One Service for httpd (ports 80 and 443) and foreman-proxy (port 8443), so
# that both answer under the same name, as Katello expects.
service:
  # ClusterIP, NodePort or LoadBalancer.
  type: ClusterIP
  # Fixed cluster IP, for example to point the Foreman server's
  # foreman.hostAliases at it. Empty lets Kubernetes choose.
  clusterIP: ""
  annotations: {}
  # Local keeps the client source address on NodePort and LoadBalancer
  # Services. Empty leaves the Kubernetes default.
  externalTrafficPolicy: ""
  # Fixed node ports for ports 80, 443 and proxy.port with type NodePort or
  # LoadBalancer, in the cluster's node port range (default 30000-32767).
  # Empty lets Kubernetes choose. Hosts reach the Smart Proxy at
  # https://<name>:<proxy.port>, so a node port for proxyHttps only helps
  # behind a proxy that maps it back to proxy.port.
  nodePorts:
    http: ""
    https: ""
    proxyHttps: ""

# Gateway API in front of the Service: TLSRoutes that pass TLS through to
# httpd (port 443) and foreman-proxy (proxy.port), and an HTTPRoute for port
# 80, for name and serverAliases. httpd and foreman-proxy still terminate TLS
# and check client certificates; they see the Gateway's address as the
# client address. Needs the TLSRoute API, gateway.networking.k8s.io/v1
# (Gateway API 1.5 or later) or v1alpha2 (older experimental channel), and an
# implementation that supports it. An Ingress cannot carry proxy.port, so
# this chart has no Ingress option.
gateway:
  enabled: false
  # Existing Gateways to attach the routes to, as Gateway API parentRefs
  # without sectionName ([{name: shared, namespace: gateways}]). Their
  # listeners must allow routes from this namespace. Leave empty when
  # create.enabled.
  parentRefs: []
  # Listener names (sectionName) the routes attach to. A Gateway needs two
  # TLS passthrough listeners, on 443 and on proxy.port; set both names.
  listeners:
    https: https
    proxyHttps: proxy-https
    http: http
  # Add the HTTPRoute for port 80.
  http: true
  # Create a Gateway <fullname> with TLS passthrough listeners on 443 and
  # proxy.port and an HTTP listener on 80, named as in listeners, and
  # attach the routes to it.
  create:
    enabled: false
    # GatewayClass of the Gateway, required.
    className: ""
    annotations: {}

httpd:
  image:
    repository: registry.access.redhat.com/ubi10/httpd-24
    # Image index digest (multi-arch). Takes precedence over tag when set.
    digest: sha256:0e9fe3a115d47217ba155152b9e65a6356cab67d6cf39d44437a12a28e85fe55
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  # Seconds httpd waits for the Foreman server on /rhsm.
  rhsmTimeout: 180
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

proxy:
  image:
    repository: quay.io/foreman/foreman-proxy
    tag: nightly
    digest: ""
    pullPolicy: IfNotPresent
  logLevel: INFO
  port: 8443
  # Remote Execution over SSH (feature Script): the foreman-proxy pod logs in
  # to hosts with this key and runs the job there. Foreman sends a job to a
  # Smart Proxy of the host's subnet, or, when the Foreman setting
  # remote_execution_prefer_registered_through_proxy is on, to the Smart Proxy
  # the host registered through. Jobs are kept in memory: a job running when
  # the pod restarts is lost.
  remoteExecutionSsh:
    enabled: false
    # Secret with the SSH key pair, keys id_rsa_foreman_proxy and
    # id_rsa_foreman_proxy.pub. Empty means <release>-ssh. Hosts must trust
    # the public key; Global Registration installs it on hosts.
    secretName: ""
  # Ansible jobs (feature Ansible), over the same SSH key. Takes effect only
  # with remoteExecutionSsh.enabled. The image has ansible-core and the
  # theforeman.foreman collection; no other roles or collections.
  ansible:
    enabled: true
  # Container gateway (feature Container_Gateway): hosts pull container
  # images of the repositories synced to this Smart Proxy from
  # https://<name>/v2/, logged in with their Foreman user or their
  # subscription certificate. It keeps users, tokens and repository lists in a
  # PostgreSQL database. httpd and foreman-proxy call each other by name, so
  # name must resolve from the pods of this release (cluster DNS, for example
  # the Service name, or hostAliases).
  containerGateway:
    enabled: false
    # Base URL of this release's httpd, where the gateway reaches Pulp's
    # registry with the client certificate from the bundle Secret. Default
    # https://<name>.
    pulpEndpoint: ""
    database:
      host: postgresql
      port: 5432
      name: container_gateway
      user: container_gateway
      sslMode: disable
      # Secret in the release namespace with the database password.
      existingSecret: container-gateway-runtime
      passwordSecretKey: DATABASE_PASSWORD
      maxConnections: 30
      poolTimeout: 30
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi

# After every install and upgrade a Job registers this Smart Proxy in Foreman
# with OAuth-signed API requests: <name> (https://<name>:8443, foreman-proxy)
# and <name>-pulp (https://<name>/pulp/api/v3/smart_proxy, Pulp in mirror
# mode). It creates or updates both, adds organizations and locations, keeps
# existing assignments, refreshes the features and waits until Foreman reports
# them (and, with Remote Execution, has stored the SSH public key). Then it
# adds the lifecycle environments below to <name>-pulp.
registration:
  # Organization and location names. Empty means all that exist when the Job
  # runs.
  organizations: []
  locations: []
  # Lifecycle environment names, for example [Library], added in every
  # organization of the Smart Proxy that has them. Hosts can use this Smart
  # Proxy as content source only for its lifecycle environments.
  lifecycleEnvironments: []
  # on_demand, immediate, streamed or inherit. Empty keeps Foreman's default
  # (the default_proxy_download_policy setting, on_demand unless changed).
  downloadPolicy: ""
  # The former name of this Smart Proxy, after name changed (for example
  # after tools/restore.sh into another namespace). When Foreman has no
  # records named <name> and <name>-pulp, the Job renames <previousName> and
  # <previousName>-pulp instead of creating new ones, so hosts keep them as
  # registration and content source. Hosts must then reach the new name.
  previousName: ""
  # Seconds the Job keeps retrying until Foreman accepts both records with
  # all features.
  timeoutSeconds: 600
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi

# Pulp in mirror mode: it syncs the content Katello assigns to this Smart
# Proxy from the Foreman server's Pulp. Three Deployments (api, content,
# worker) share one content volume; a migration Job runs before every install
# and upgrade. Settings that are not secret are rendered into
# /etc/pulp/settings.py; credentials come from existingSecret.
pulp:
  image:
    repository: quay.io/foreman/pulp
    tag: foreman-nightly
    digest: ""
    pullPolicy: IfNotPresent
  # Secret in the release namespace with the keys named below.
  existingSecret: pulp-runtime
  databasePasswordSecretKey: DATABASE_PASSWORD
  # Django SECRET_KEY.
  secretKeySecretKey: SECRET_KEY
  # Valkey or Redis URL, for example redis://valkey:6379/8. Required: Katello
  # treats a Pulp without it as unavailable.
  redisUrlSecretKey: REDIS_URL
  # Fernet key Pulp uses to encrypt database fields, created with
  # `openssl rand -base64 32 | tr '+/' '-_'`. Keep it: data encrypted with a
  # lost key cannot be read.
  symmetricKeySecretKey: database_fields.symmetric.key
  database:
    host: postgresql
    port: 5432
    name: pulp
    user: pulp
    sslMode: disable
  settings:
    # Base URL hosts download content from. Default https://<name>.
    contentOrigin: ""
    # Pulp API URL that Pulp advertises to Foreman. Katello sends its API
    # calls for this Smart Proxy there. Default https://<name>.
    smartProxyPulpUrl: ""
    # URL hosts send subscription requests to. Default https://<name>/rhsm.
    rhsmUrl: ""
    enabledPlugins:
      - pulp_certguard
      - pulp_file
      - pulp_smart_proxy
      - pulp_container
      - pulp_rpm
    # Pulp trusts the user name in this WSGI variable. HTTP_REMOTE_USER is the
    # REMOTE-USER request header, which httpd sets for foreman.clientNames.
    remoteUserEnvironName: HTTP_REMOTE_USER
    logLevel: info
    # Extra Python appended to settings.py. No secrets here.
    extra: ""
  api:
    replicas: 1
    # Gunicorn worker processes per pod.
    workers: 2
    resources:
      requests:
        cpu: 100m
        memory: 384Mi
      limits:
        memory: 1Gi
    # Only the httpd pods of this release may connect to the API, because
    # Pulp trusts the REMOTE-USER header. Takes effect only where the network
    # plugin enforces NetworkPolicy. Anyone who can create pods in the
    # namespace can add the labels.
    networkPolicy:
      enabled: true
      clientPodLabels:
        app.kubernetes.io/component: httpd
  content:
    replicas: 1
    workers: 2
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
  worker:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 2Gi
  migration:
    backoffLimit: 2
    activeDeadlineSeconds: 1200
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
  # Containers, volumes, volume mounts and environment variables added to the
  # Pulp API, content and worker pods and to the migration Job.
  extraInitContainers: []
  extraVolumes: []
  extraVolumeMounts: []
  extraEnv: []
  storage:
    # filesystem (a PersistentVolumeClaim at /var/lib/pulp) or s3 (a bucket;
    # each Pulp pod gets an emptyDir at /var/lib/pulp for temporary files).
    # The Pulp image must contain django-storages and boto3 for s3.
    type: filesystem
    s3:
      # Required with type s3.
      bucket: ""
      # Leave empty for AWS S3. For other object stores the full URL.
      endpointUrl: ""
      region: ""
      # path, virtual or empty for the boto3 default.
      addressingStyle: ""
      signatureVersion: s3v4
      # Secret with the access key and secret key. Leave empty when the pods
      # get credentials another way.
      existingSecret: ""
      accessKeySecretKey: AWS_ACCESS_KEY_ID
      secretKeySecretKey: AWS_SECRET_ACCESS_KEY
      # Secret with the CA bundle that signed the endpoint certificate. Empty
      # uses the CA bundle of the Pulp image.
      caSecret:
        name: ""
        key: ca.crt
      # Set false to skip TLS verification of the endpoint. Only for tests.
      verify: true
      # The content app serves every file itself, so the bucket stays
      # private and every download passes Pulp's entitlement check. Set
      # true to answer with a redirect to a signed bucket URL instead:
      # hosts must then reach and trust the endpoint, and anyone with the
      # URL can download the file until the signature expires.
      redirectToObjectStorage: false
      # More django-storages S3 options, for example {"location": "pulp"}.
      # Not for credentials (access_key, secret_key, security_token,
      # session_token, session_profile): they would land in a ConfigMap, so
      # the chart rejects them. Use existingSecret.
      options: {}
    # The settings below apply to type filesystem only.
    # With existingClaim set, the chart creates no claim.
    existingClaim: ""
    size: 10Gi
    # Empty uses the cluster default StorageClass.
    storageClass: ""
    accessMode: ReadWriteOnce
    # Schedule content and worker pods on the node of a Pulp API pod, so they
    # can share a ReadWriteOnce volume. Set false with ReadWriteMany storage.
    colocate: true
