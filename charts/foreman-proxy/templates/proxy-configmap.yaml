{{- /*
Settings ported from foremanctl src/roles/foreman_proxy for a Smart Proxy with
content. The image ships every module in settings.d with :enabled: false; the
files below turn on the ones this release uses (proxy.modules). Logs go to
stdout instead of the journal.
*/}}
{{- $tls := include "proxy.tlsPath" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "proxy.fullname" . }}
  labels:
    {{- include "foreman-proxy.componentLabels" (dict "context" . "component" "proxy") | nindent 4 }}
data:
  settings.yml: |
    ---
    :settings_directory: /etc/foreman-proxy/settings.d
    :foreman_url: {{ include "foreman-proxy.foremanUrl" . | quote }}
    # Host names accepted in the HTTP Host header.
    :permitted_hosts:
      {{- range prepend .Values.serverAliases .Values.name }}
      - {{ . | quote }}
      {{- end }}
    # Client certificate names allowed to call the proxy: the Foreman server.
    :trusted_hosts:
      {{- range (include "foreman-proxy.foremanClientNames" . | fromJsonArray) }}
      - {{ . | quote }}
      {{- end }}
    :https_port: {{ .Values.proxy.port }}
    :ssl_ca_file: {{ $tls }}/ca.crt
    :ssl_certificate: {{ $tls }}/server.crt
    :ssl_private_key: {{ $tls }}/server.key
    # Calls to the Foreman server: verified against its server CA, with this
    # Smart Proxy's client certificate, which Foreman matches with the host
    # name of the registered proxy URL.
    :foreman_ssl_ca: {{ $tls }}/server-ca.crt
    :foreman_ssl_cert: {{ $tls }}/client.crt
    :foreman_ssl_key: {{ $tls }}/client.key
    :bind_host: '*'
    :log_level: {{ .Values.proxy.logLevel | upper | quote }}
    :log_file: STDOUT
    :log_buffer: 2000
    :log_buffer_errors: 1000
  logs.yml: |
    ---
    :enabled: https
  dynflow.yml: |
    ---
    :enabled: https
    # Empty: plans are kept in memory, as in foremanctl.
    :database:
  # Hosts call /register on this proxy; it forwards the request to the
  # Foreman server with its client certificate.
  registration.yml: |
    ---
    :enabled: https
    :registration_url: {{ include "proxy.url" . | quote }}
  # Required by registration.
  templates.yml: |
    ---
    :enabled: https
    :template_url: {{ include "proxy.url" . | quote }}
  {{- $modules := include "proxy.modules" . | fromJsonArray }}
  {{- if has "remote_execution_ssh" $modules }}
  # The key comes from a Secret volume (root:991, 0440). ~/.ssh stays
  # writable for known_hosts.
  remote_execution_ssh.yml: |
    ---
    :enabled: https
    :ssh_identity_key_file: /etc/foreman-proxy/ssh/id_rsa_foreman_proxy
    :local_working_dir: /var/tmp
    :remote_working_dir: /var/tmp
    :socket_working_dir: /var/tmp
    :mode: ssh
  {{- end }}
  {{- if has "ansible" $modules }}
  ansible.yml: |
    ---
    :enabled: https
    :ansible_dir: /usr/share/foreman-proxy
    :ansible_environment_file: /etc/foreman-proxy/ansible.env
    :working_dir: /var/tmp
  # The theforeman.foreman callback sends facts and reports to the Foreman
  # server with this Smart Proxy's client certificate.
  ansible.env: |
    export ANSIBLE_CALLBACKS_ENABLED="theforeman.foreman.foreman"
    export ANSIBLE_LOCAL_TEMP="/tmp"
    export ANSIBLE_HOST_KEY_CHECKING="False"
    export ANSIBLE_ROLES_PATH="/etc/ansible/roles:/usr/share/ansible/roles"
    export ANSIBLE_COLLECTIONS_PATH="/etc/ansible/collections:/usr/share/ansible/collections"
    export FOREMAN_URL={{ include "foreman-proxy.foremanUrl" . | quote }}
    export FOREMAN_SSL_CERT="{{ $tls }}/client.crt"
    export FOREMAN_SSL_KEY="{{ $tls }}/client.key"
    export FOREMAN_SSL_VERIFY="{{ $tls }}/server-ca.crt"
    export ANSIBLE_SSH_ARGS="-C -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=15 -o ServerAliveCountMax=3"
  {{- end }}
