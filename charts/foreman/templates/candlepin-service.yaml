{{- if .Values.candlepin.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "candlepin.fullname" . }}
  labels:
    {{- include "candlepin.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "candlepin.selectorLabels" . | nindent 4 }}
  ports:
    - name: https
      port: 23443
      targetPort: https
      protocol: TCP
{{- end }}
