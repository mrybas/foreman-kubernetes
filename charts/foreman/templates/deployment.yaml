apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "foreman.fullname" . }}
  labels:
    {{- include "foreman.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "foreman.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "foreman.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
      annotations:
        {{- include "foreman.configChecksum" (include "foreman.configurationData" (dict "context" . "web" true)) | nindent 8 }}
    spec:
      securityContext:
        fsGroup: 994
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 994
        runAsNonRoot: true
        runAsUser: 994
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.katello.enabled }}
      initContainers:
        {{- include "katello.initContainer" . | nindent 8 }}
      {{- end }}
      containers:
        - name: foreman
          image: {{ include "foreman.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            {{- if .Values.katello.enabled }}
            # The Katello event daemon runs inside Puma and does not start
            # while its PID file from before a container restart names a
            # running process (Katello #11891). tmp survives the restart.
            - /bin/bash
            - -c
            - >-
              rm -f /usr/share/foreman/tmp/pids/katello_event_daemon.pid &&
              exec /usr/share/foreman/bin/rails server --environment production --pid /tmp/rails.pid
            {{- else }}
            - /usr/share/foreman/bin/rails
            - server
            - --environment
            - production
            - --pid
            - /tmp/rails.pid
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsGroup: 994
            runAsUser: 994
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            {{- include "foreman.env" . | nindent 12 }}
          volumeMounts:
            {{- include "foreman.volumeMounts" . | nindent 12 }}
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/v2/ping
              port: http
              httpHeaders:
                - name: Host
                  value: {{ .Values.foreman.fqdn | quote }}
                {{- if .Values.httpd.enabled }}
                # Foreman requires HTTPS behind httpd and would redirect.
                - name: X-Forwarded-Proto
                  value: https
                {{- end }}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: configuration
          configMap:
            name: {{ include "foreman.configName" . }}
        - name: temporary
          emptyDir: {}
        {{- if .Values.certificates.enabled }}
        {{- include "foreman.certificatesVolume" . | nindent 8 }}
        {{- end }}
        {{- if .Values.katello.enabled }}
        {{- include "katello.volume" . | nindent 8 }}
        {{- end }}
