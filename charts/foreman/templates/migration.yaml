apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "foreman.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "foreman.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: "0"
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  {{- $secret := .Values.foreman.existingSecret }}
  {{- $env := list
    (dict "name" "SEED_ADMIN_USER" "valueFrom" (dict "secretKeyRef" (dict "name" $secret "key" .Values.foreman.seedAdminUserSecretKey)))
    (dict "name" "SEED_ADMIN_PASSWORD" "valueFrom" (dict "secretKeyRef" (dict "name" $secret "key" .Values.foreman.seedAdminPasswordSecretKey)))
  }}
  template:
    {{- include "foreman.jobPodTemplate" (dict
      "context" .
      "component" "migration"
      "container" "migrate"
      "command" (list "/bin/bash" "-ec" "bin/rails db:migrate && bin/rails db:seed")
      "env" $env
      "web" false
      "restartPolicy" "OnFailure"
      "resources" .Values.resources) | nindent 4 }}
