{{- if and .Values.pulp.enabled (eq (include "pulp.storageType" .) "filesystem") (not .Values.pulp.storage.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "pulp.claimName" . }}
  labels:
    {{- include "pulp.labels" (dict "context" . "component" "pulp") | nindent 4 }}
  annotations:
    # Repository content survives helm uninstall. Delete the claim by hand.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - {{ .Values.pulp.storage.accessMode }}
  {{- with .Values.pulp.storage.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.pulp.storage.size }}
{{- end }}
