{{- if .Values.dynflow.enabled }}
{{- /*
Three Sidekiq processes run Dynflow. The orchestrator uses the image's
orchestrator.yml. The workers take queues and concurrency as arguments:
worker.yml in the image is static (default, remote_execution, concurrency 10)
and ignores FOREMAN_DYNFLOW_QUEUES and FOREMAN_DYNFLOW_CONCURRENCY.
*/}}
{{- $root := . }}
{{- $d := .Values.dynflow }}
{{- $processes := list
  (dict "name" "orchestrator" "config" "orchestrator" "replicas" 1 "concurrency" 1 "queues" (list) "resources" $d.orchestrator.resources)
  (dict "name" "worker" "config" "worker" "replicas" $d.worker.replicas "concurrency" $d.worker.concurrency "queues" $d.worker.queues "resources" $d.worker.resources)
  (dict "name" "worker-hosts-queue" "config" "worker" "replicas" $d.hostsQueue.replicas "concurrency" $d.hostsQueue.concurrency "queues" (list "hosts_queue") "resources" $d.hostsQueue.resources)
}}
{{- $probe := list "grep" "-qF" "busy]" "/proc/1/cmdline" | toJson }}
{{- range $processes }}
{{- $component := printf "dynflow-%s" .name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "foreman.componentName" (list $root $component) }}
  labels:
    {{- include "foreman.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  replicas: {{ .replicas }}
  {{- if eq .name "orchestrator" }}
  # A new orchestrator waits for the Redis lock held by the old one and never
  # becomes ready, so a rolling update would never finish.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "foreman.selectorLabels" $root | nindent 6 }}
      app.kubernetes.io/component: {{ $component }}
  template:
    metadata:
      labels:
        {{- include "foreman.selectorLabels" $root | nindent 8 }}
        app.kubernetes.io/component: {{ $component }}
      annotations:
        {{- include "foreman.configChecksum" (include "foreman.configurationData" (dict "context" $root "web" true)) | nindent 8 }}
    spec:
      # Sidekiq waits up to 25 seconds for running jobs after SIGTERM.
      terminationGracePeriodSeconds: 45
      securityContext:
        fsGroup: 994
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 994
        runAsNonRoot: true
        runAsUser: 994
        seccompProfile:
          type: RuntimeDefault
      {{- with include "foreman.lostNodeTolerations" $root }}{{ . | nindent 6 }}{{ end }}
      {{- with $root.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $root.Values.foreman.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if ne .name "orchestrator" }}
      {{- with include "foreman.topologySpread" (dict "context" $root "component" $component "replicas" .replicas) }}{{ . | nindent 6 }}{{ end }}
      {{- end }}
      {{- if $root.Values.katello.enabled }}
      initContainers:
        {{- include "katello.initContainer" $root | nindent 8 }}
      {{- end }}
      containers:
        - name: dynflow
          image: {{ include "foreman.image" $root }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          workingDir: /usr/share/foreman
          command:
            - sidekiq
            - -e
            - production
            - -r
            - ./extras/dynflow-sidekiq.rb
            {{- if .queues }}
            - -c
            - {{ .concurrency | quote }}
            {{- range .queues }}
            - -q
            - {{ . | quote }}
            {{- end }}
            {{- else }}
            - -C
            - /etc/foreman/dynflow/{{ .config }}.yml
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsGroup: 994
            runAsUser: 994
          env:
            {{- include "foreman.env" (merge (dict "databasePool" (add .concurrency 5)) $root) | nindent 12 }}
            - name: DYNFLOW_REDIS_URL
              value: $(FOREMAN_REDIS_URL)/6
            - name: REDIS_PROVIDER
              value: DYNFLOW_REDIS_URL
            {{- if .queues }}
            - name: FOREMAN_DYNFLOW_QUEUES
              value: {{ join "," .queues | quote }}
            {{- end }}
            - name: FOREMAN_DYNFLOW_CONCURRENCY
              value: {{ .concurrency | quote }}
          volumeMounts:
            {{- include "foreman.volumeMounts" $root | nindent 12 }}
          # Sidekiq sets its process title to "sidekiq <version> [N of M busy]"
          # once Dynflow is initialized. A passive orchestrator waiting for the
          # lock has no such title. The image has no ps or pgrep. For the
          # workers liveness is the same check. The orchestrator also has to
          # hold its LISTEN session in the database: after a database failover
          # it can lose it and keep running, and remote execution jobs then
          # never finish.
          startupProbe:
            exec:
              command: {{ $probe }}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: {{ $probe }}
            periodSeconds: 10
          livenessProbe:
            exec:
              {{- if eq .name "orchestrator" }}
              command:
                - ruby
                - -e
                - |
                  {{- $root.Files.Get "files/dynflow-orchestrator-liveness.rb" | nindent 18 }}
              {{- else }}
              command: {{ $probe }}
              {{- end }}
            periodSeconds: 20
            {{- if eq .name "orchestrator" }}
            timeoutSeconds: 10
            {{- end }}
            failureThreshold: 3
          resources:
            {{- toYaml .resources | nindent 12 }}
      volumes:
        - name: configuration
          configMap:
            name: {{ include "foreman.configName" $root }}
        - name: temporary
          emptyDir: {}
        {{- if $root.Values.certificates.enabled }}
        {{- include "foreman.certificatesVolume" $root | nindent 8 }}
        {{- end }}
        {{- if $root.Values.katello.enabled }}
        {{- include "katello.volume" $root | nindent 8 }}
        {{- end }}
{{- end }}
{{- end }}
