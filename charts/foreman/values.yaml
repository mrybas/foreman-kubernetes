replicaCount: 1

image:
  repository: quay.io/foreman/foreman
  tag: nightly
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

foreman:
  fqdn: foreman.example.test
  externalUrl: http://foreman.example.test
  existingSecret: foreman-runtime
  databaseUrlSecretKey: DATABASE_URL
  encryptionKeySecretKey: ENCRYPTION_KEY
  secretKeyBaseSecretKey: SECRET_KEY_BASE
  seedAdminUserSecretKey: SEED_ADMIN_USER
  seedAdminPasswordSecretKey: SEED_ADMIN_PASSWORD
  # Key in existingSecret with the Valkey or Redis URL, without a database
  # number, for example redis://valkey:6379. Read only when dynflow.enabled is
  # true. Dynflow uses database 6 and the Rails cache of every Foreman pod
  # uses database 4.
  redisUrlSecretKey: REDIS_URL
  database:
    sslMode: disable
  puma:
    workers: 1
    threadsMin: 5
    threadsMax: 5

# TLS certificates, read from existing Secrets. The chart does not create
# certificates and does not need cert-manager. Create the Secrets in the
# release namespace before installing. Empty names default to the names below,
# where <release> is the Helm release name.
certificates:
  # When true, the Foreman web pods mount the CA bundle and the client
  # certificate, and settings.yaml points ssl_ca_file, ssl_certificate and
  # ssl_priv_key at them. Foreman uses these for HTTPS connections to Smart
  # Proxies. The migration Job mounts neither.
  enabled: false
  ca:
    # Secret holding the CA bundle Foreman trusts for outgoing HTTPS. Default
    # <release>-ca. It may also point at a kubernetes.io/tls Secret that has a
    # ca.crt key.
    secretName: ""
    key: ca.crt
  client:
    # kubernetes.io/tls Secret (tls.crt, tls.key) with the certificate Foreman
    # presents as a TLS client. Default <release>-client-tls. Its CN should be
    # the Foreman FQDN.
    secretName: ""

# Dynflow runs Foreman background tasks in Sidekiq processes that use the
# same image as the web pod. Enabling it also enables the foreman-tasks plugin
# in all Foreman pods and requires Valkey or Redis (foreman.redisUrlSecretKey).
dynflow:
  enabled: false
  # The orchestrator always runs one replica: only one orchestrator can be
  # active at a time.
  orchestrator:
    resources:
      requests:
        cpu: 50m
        memory: 512Mi
      limits:
        memory: 1Gi
  # Runs tasks from the given queues.
  worker:
    replicas: 1
    concurrency: 10
    queues:
      - default
      - remote_execution
    resources:
      requests:
        cpu: 50m
        memory: 512Mi
      limits:
        memory: 1Gi
  # Runs tasks from hosts_queue.
  hostsQueue:
    replicas: 1
    concurrency: 5
    resources:
      requests:
        cpu: 50m
        memory: 512Mi
      limits:
        memory: 1Gi

migration:
  backoffLimit: 2
  activeDeadlineSeconds: 1200

service:
  type: ClusterIP
  port: 3000

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 2Gi

test:
  image: curlimages/curl:8.17.0
