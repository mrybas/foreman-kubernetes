# Foreman web replicas. Web pods keep no local state: sessions are stored in
# the database. Other replica counts are under their component; the Dynflow
# orchestrator, Candlepin and the Smart Proxy always run one replica.
replicaCount: 1

# A PodDisruptionBudget (PDB) for each workload that runs more than one
# replica, so that draining a node evicts its replicas one at a time: Foreman
# web, httpd, the Dynflow workers, and the Pulp Deployments with S3 storage or
# pulp.storage.colocate=false. With colocated filesystem storage every Pulp pod
# must run on one node, so a budget would block the drain of that node.
# unhealthyPodEvictionPolicy is AlwaysAllow, so pods that are not ready never
# block a drain.
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

# Spread the replicas of the same workloads across nodes. ScheduleAnyway
# makes it a preference: pods still start when there are fewer nodes than
# replicas.
topologySpread:
  enabled: true
  topologyKey: kubernetes.io/hostname
  maxSkew: 1
  whenUnsatisfiable: ScheduleAnyway

# Every image value below takes repository, tag and digest. A digest
# (sha256:...) takes precedence over the tag; pin digests for reproducible
# installs and upgrades. The Foreman image is used by the web, Dynflow,
# migration, registration Job and cron Job pods.
image:
  repository: quay.io/foreman/foreman
  tag: nightly
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

foreman:
  fqdn: foreman.example.test
  externalUrl: http://foreman.example.test
  existingSecret: foreman-runtime
  databaseUrlSecretKey: DATABASE_URL
  encryptionKeySecretKey: ENCRYPTION_KEY
  secretKeyBaseSecretKey: SECRET_KEY_BASE
  seedAdminUserSecretKey: SEED_ADMIN_USER
  seedAdminPasswordSecretKey: SEED_ADMIN_PASSWORD
  # Key in existingSecret with the Valkey or Redis URL, without a database
  # number, for example redis://valkey:6379. Read only when dynflow.enabled is
  # true. Dynflow uses database 6 and the Rails cache of every Foreman pod
  # uses database 4.
  redisUrlSecretKey: REDIS_URL
  database:
    sslMode: disable
  puma:
    workers: 1
    threadsMin: 5
    threadsMax: 5
  # Extra addresses or CIDRs Foreman trusts to set X-Forwarded-For, added to
  # 127.0.0.0/8 and ::1. Set it to the pod network range when httpd is
  # enabled so Foreman sees the real client address.
  trustedProxies: []
  # OAuth 1.0a consumer for API clients that sign their requests, such as a
  # Smart Proxy with content that registers itself (foremanctl puts the same
  # pair in a proxy's auth bundle). Empty existingSecret leaves OAuth off. When
  # set, an init container of the web pods writes oauth_active, the key and
  # the secret into Foreman's settings, which then show them as read-only.
  # oauth_map_users is false, as in foremanctl, so a signed request acts as an
  # administrator: whoever has the pair has full API access.
  oauth:
    existingSecret: ""
    consumerKeySecretKey: OAUTH_CONSUMER_KEY
    consumerSecretSecretKey: OAUTH_CONSUMER_SECRET
  # Extra /etc/hosts entries for the Foreman web and Dynflow pods, the
  # registration Jobs and the cron Jobs, in the pod hostAliases format
  # ([{ip: 192.0.2.10, hostnames: [capsule.example.test]}]). Foreman connects
  # to every Smart Proxy by the host name of its URL, including the Pulp URL a
  # Smart Proxy with content advertises. Use this when those names are not in
  # the cluster DNS.
  hostAliases: []

# TLS certificates, read from existing Secrets. The chart does not create
# certificates and does not need cert-manager. Create the Secrets in the
# release namespace before installing. Empty names default to the names below,
# where <release> is the Helm release name.
certificates:
  # When true, the Foreman web pods mount the CA bundle and the client
  # certificate, and settings.yaml points ssl_ca_file, ssl_certificate and
  # ssl_priv_key at them. Foreman uses these for HTTPS connections to Smart
  # Proxies. The Dynflow and cron pods mount them too. The migration Job
  # mounts neither.
  enabled: false
  ca:
    # Secret holding the CA bundle Foreman trusts for outgoing HTTPS. Default
    # <release>-ca. It may also point at a kubernetes.io/tls Secret that has a
    # ca.crt key.
    secretName: ""
    key: ca.crt
  client:
    # kubernetes.io/tls Secret (tls.crt, tls.key) with the certificate Foreman
    # presents as a TLS client. Default <release>-client-tls. Its CN should be
    # the Foreman FQDN.
    secretName: ""
  # Candlepin mounts these whenever candlepin.enabled is true, independent of
  # certificates.enabled.
  candlepin:
    ca:
      # kubernetes.io/tls Secret (tls.crt, tls.key) with the CA certificate and
      # private key Candlepin uses to sign consumer certificates. Tomcat also
      # uses tls.crt to verify client certificates. Default
      # <release>-candlepin-ca. Whoever holds this key can issue certificates
      # that everything trusting this CA accepts.
      secretName: ""
    server:
      # kubernetes.io/tls Secret (tls.crt, tls.key) with the Tomcat HTTPS server
      # certificate. Default <release>-candlepin-tls. Its SANs must include the
      # Candlepin Service name <fullname>-candlepin (by default
      # <release>-foreman-candlepin) and localhost. Foreman must
      # trust its issuer through the certificates.ca bundle.
      secretName: ""

  server:
    # kubernetes.io/tls Secret (tls.crt, tls.key, ca.crt) with the HTTPS
    # server certificate of the httpd front door. Default <release>-server-tls.
    # Its subject alternative names must include foreman.fqdn, and also
    # <fullname>-httpd.<namespace>.svc (by default
    # <release>-foreman-httpd.<namespace>.svc) for clients inside the cluster.
    secretName: ""

# Dynflow runs Foreman background tasks in Sidekiq processes that use the
# same image as the web pod. Enabling it also enables the foreman-tasks plugin
# in all Foreman pods and requires Valkey or Redis (foreman.redisUrlSecretKey).
dynflow:
  enabled: false
  # The orchestrator always runs one replica: only one orchestrator can be
  # active at a time.
  orchestrator:
    resources:
      requests:
        cpu: 50m
        memory: 512Mi
      limits:
        memory: 1Gi
  # Runs tasks from the given queues.
  worker:
    replicas: 1
    concurrency: 10
    queues:
      - default
      - remote_execution
    resources:
      requests:
        cpu: 50m
        memory: 512Mi
      limits:
        memory: 1Gi
  # Runs tasks from hosts_queue.
  hostsQueue:
    replicas: 1
    concurrency: 5
    resources:
      requests:
        cpu: 50m
        memory: 512Mi
      limits:
        memory: 1Gi

# HTTPS front door: an Apache httpd Deployment and a <fullname>-httpd Service
# (ports 80 and 443) in front of Foreman. It terminates TLS, accepts optional
# client certificates verified against the certificates.ca bundle and passes
# them to Foreman. Requires certificates.enabled. When enabled, Foreman also
# requires HTTPS and redirects plain HTTP requests to it.
httpd:
  enabled: false
  image:
    repository: registry.access.redhat.com/ubi10/httpd-24
    # Image index digest (multi-arch). Takes precedence over tag when set.
    digest: sha256:0e9fe3a115d47217ba155152b9e65a6356cab67d6cf39d44437a12a28e85fe55
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  # Extra host names httpd answers to, besides foreman.fqdn and the Service
  # names.
  serverAliases: []
  # Client certificate common names (CN), besides foreman.fqdn, that Pulp
  # accepts as its admin user.
  pulpTrustedClientNames: []
  # Client certificate common names (CN) of Smart Proxies with content
  # (capsules) that forward /rhsm requests of their hosts to this server.
  # httpd removes X-RHSM-SSL-CLIENT-CERT and X-Forwarded-Host in every spelling
  # from all clients, except from a client whose certificate it verified and
  # whose CN is listed here. From such a proxy it keeps X_RHSM_SSL_CLIENT_CERT
  # (the host's certificate; Katello authenticates the host with it) and the
  # last X-Forwarded-Host value (Katello picks the host's content source by
  # it). A listed proxy can act as any host, so list only proxies you run.
  # Each entry is a host name, compared literally (no wildcards). Only the
  # first CN of the certificate counts, so the CA in certificates.ca must
  # issue a certificate with such a CN only to that proxy.
  trustedProxyClientNames: []
  service:
    # ClusterIP, NodePort or LoadBalancer.
    type: ClusterIP
    # Fixed cluster IP of the Service, for example to point foreman.hostAliases
    # at it. Empty lets Kubernetes choose.
    clusterIP: ""
    annotations: {}
    # Local keeps the client source address on NodePort and LoadBalancer
    # Services. Empty leaves the Kubernetes default.
    externalTrafficPolicy: ""
    # Fixed node ports for ports 80 and 443 with type NodePort or
    # LoadBalancer, in the cluster's node port range (default 30000-32767).
    # Empty lets Kubernetes choose.
    nodePorts:
      http: ""
      https: ""
  # The options below put a proxy in front of the Service that passes TLS
  # through unchanged, matched by the server name (SNI) the client sends.
  # httpd still terminates TLS and checks client certificates, which /rhsm,
  # /pulp/content and the Pulp API need. Proxies that terminate TLS
  # themselves do not work: Katello cannot read the client certificate they
  # forward. httpd sees the proxy's address as the client address.
  #
  # An Ingress for foreman.fqdn and serverAliases. The passthrough setting
  # is controller specific, so set it in annotations, for example
  # nginx.ingress.kubernetes.io/ssl-passthrough: "true" for ingress-nginx
  # (started with --enable-ssl-passthrough). The rule for "/" points at port
  # 443 of the Service, which the controller uses for TLS passthrough.
  ingress:
    enabled: false
    className: ""
    annotations: {}
    # Paths routed to port 80 of the Service, for plain HTTP clients on the
    # controller's port 80. Other paths over plain HTTP reach port 443 and
    # fail. Empty adds no such paths.
    httpPaths:
      - /pub
      - /pulp/content
      - /pulp/isos
  # Gateway API: a TLSRoute (TLS passthrough to port 443) and an HTTPRoute
  # (port 80) for foreman.fqdn and serverAliases. Needs the TLSRoute API,
  # gateway.networking.k8s.io/v1 (Gateway API 1.5 or later) or v1alpha2
  # (older experimental channel), and an implementation that supports it.
  gateway:
    enabled: false
    # Existing Gateways to attach the routes to, as Gateway API parentRefs
    # without sectionName ([{name: shared, namespace: gateways}]). Their
    # listeners must allow routes from this namespace. Leave empty when
    # create.enabled.
    parentRefs: []
    # Listener names (sectionName) the routes attach to. Empty attaches to
    # every listener of a parent that accepts the route kind.
    listeners:
      https: https
      http: http
    # Add the HTTPRoute for port 80.
    http: true
    # Create a Gateway <fullname>-httpd with a TLS passthrough listener on
    # 443 and an HTTP listener on 80, named as in listeners, and attach the
    # routes to it.
    create:
      enabled: false
      # GatewayClass of the Gateway, required.
      className: ""
      annotations: {}
  # Traefik: an IngressRouteTCP with TLS passthrough for foreman.fqdn and
  # serverAliases, and an IngressRoute for plain HTTP. A plain Ingress cannot
  # pass TLS through on Traefik. Needs the traefik.io/v1alpha1 CRDs.
  traefik:
    enabled: false
    httpsEntryPoints:
      - websecure
    # Empty adds no IngressRoute.
    httpEntryPoints:
      - web
  # Allow connections to the Foreman web port only from the httpd pods of this
  # release and the helm test pod, so that other pods cannot bypass httpd and
  # send their own client certificate or forwarding headers. Pods are matched
  # by their labels, which anyone who can create pods in the namespace can
  # set. Needs a network plugin that enforces NetworkPolicy. Without httpd the
  # chart adds no policy.
  networkPolicy:
    enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

# Smart Proxy (foreman-proxy) with Remote Execution over SSH and Ansible.
# Requires certificates.enabled and dynflow.enabled. Enabling it also enables
# the foreman_remote_execution plugin, and foreman_ansible when ansible is on,
# in all Foreman pods. A Helm hook Job registers the proxy in Foreman.
proxy:
  enabled: false
  image:
    repository: quay.io/foreman/foreman-proxy
    tag: nightly
    digest: ""
    pullPolicy: IfNotPresent
  # Name of the Smart Proxy in Foreman. Empty means the host name of url.
  name: ""
  # URL Foreman uses to reach the proxy. Empty means the pod's name in the
  # headless proxy Service,
  # https://proxy.<release>-foreman-proxy.<namespace>.svc.<clusterDomain>:8443.
  # Its host name must be in the proxy server certificate.
  url: ""
  clusterDomain: cluster.local
  # URL the proxy uses to reach Foreman. Empty means the httpd front door,
  # https://<fullname>-httpd.<namespace>.svc, when
  # httpd.enabled, else the web Service,
  # http://<release>-foreman.<namespace>.svc:<service.port>. Its host name is
  # added to Foreman's allowed hosts.
  # Foreman accepts calls from the proxy (job results, Ansible reports) when it
  # recognizes the caller as a registered proxy. Over HTTPS the proxy presents
  # its client certificate (clientTls), whose CN or a SAN must be the host name
  # of url; httpd verifies it against certificates.ca and passes it on. Over
  # plain HTTP Foreman uses reverse DNS of the caller's IP, which gives the
  # host name of the default url; plain HTTP is meant for tests.
  foremanUrl: ""
  # Names in client certificates allowed to call the proxy. Empty means
  # foreman.fqdn, the name in the Foreman client certificate.
  trustedHosts: []
  logLevel: INFO
  # Server certificate for the proxy HTTPS listener: a kubernetes.io/tls Secret
  # (tls.crt, tls.key). Empty means <release>-proxy-tls. The proxy verifies
  # client certificates against the CA bundle from certificates.ca.
  tls:
    secretName: ""
  # Client certificate the proxy presents to Foreman when foremanUrl is
  # https://: a kubernetes.io/tls Secret (tls.crt, tls.key). Empty means
  # <release>-proxy-client-tls. Its CN or a SAN must be the host name of url.
  # The proxy verifies Foreman's server certificate against certificates.ca.
  clientTls:
    secretName: ""
  remoteExecutionSsh:
    # Secret with the SSH key pair used to log in to hosts, keys
    # id_rsa_foreman_proxy and id_rsa_foreman_proxy.pub. Empty means
    # <release>-proxy-ssh. Hosts must trust the public key.
    secretName: ""
  ansible:
    enabled: true
  registration:
    # Seconds the registration Job keeps retrying until Foreman accepts the
    # proxy with all expected features and its SSH public key.
    timeoutSeconds: 600
  service:
    port: 8443
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi

migration:
  backoffLimit: 2
  activeDeadlineSeconds: 1200

# Foreman's periodic maintenance tasks, as one CronJob per period that runs
# `foreman-rake cron:<period>` with the Foreman image. The image lists the
# tasks of each period; plugins add their own:
#   hourly: ldap:refresh_usergroups
#   daily: reports:daily, db:sessions:clear, reports:expire, audits:expire,
#     foreman_tasks:cleanup (with Dynflow)
#   weekly: reports:weekly, notifications:clean,
#     katello:delete_orphaned_content, katello:refresh_alternate_content_sources
#     (with Katello)
#   monthly: reports:monthly
# The default schedules are those of /etc/cron.d/foreman in the image, which
# no process runs in a container. foremanctl runs the same commands from
# systemd timers at the start of each period with up to 2 minutes of random
# delay. Each run first checks that the database has no pending migrations
# and fails if it has. The pods use the configuration, certificates and host
# aliases of the web pods.
cron:
  enabled: true
  periods:
    hourly:
      enabled: true
      schedule: "30 * * * *"
    daily:
      enabled: true
      schedule: "0 2 * * *"
    weekly:
      enabled: true
      schedule: "0 5 * * 0"
    monthly:
      enabled: true
      schedule: "0 3 1 * *"
  # IANA time zone of the schedules, for example Europe/Prague. Empty uses
  # the time zone of the kube-controller-manager, usually UTC.
  timeZone: ""
  # Forbid: a run does not start while the previous run of the same period
  # is still active.
  concurrencyPolicy: Forbid
  # A run missed by more than this many seconds, for example while the
  # CronJob was suspended, is skipped until the next scheduled time.
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  # A failed run is not retried; the next scheduled run tries again.
  backoffLimit: 0
  # foremanctl stops a run after 30 minutes.
  activeDeadlineSeconds: 1800
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi

service:
  type: ClusterIP
  port: 3000

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 2Gi

# Candlepin manages subscriptions and content access for Katello. Disabled by
# default. It always runs as a single replica because it embeds its messaging
# broker (Artemis), which cannot be shared between pods.
candlepin:
  enabled: false
  image:
    repository: quay.io/foreman/candlepin
    tag: foreman-nightly
    digest: ""
    pullPolicy: IfNotPresent
  # Existing Secret with the database connection and the OAuth secret Katello
  # uses to authenticate to Candlepin. The keys below name its entries.
  existingSecret: candlepin-runtime
  # JDBC URL, for example
  # jdbc:postgresql://postgresql:5432/candlepin?sslmode=disable
  databaseUrlSecretKey: DATABASE_URL
  databaseUsernameSecretKey: DATABASE_USERNAME
  databasePasswordSecretKey: DATABASE_PASSWORD
  oauthSecretSecretKey: OAUTH_SECRET
  # Options for the Tomcat JVM, mainly the heap size. Keep the maximum heap
  # well below resources.limits.memory.
  javaOpts: -Xms512m -Xmx1g
  migration:
    backoffLimit: 2
    activeDeadlineSeconds: 900
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      memory: 2Gi

# Image of the pod that `helm test` runs to ping Foreman.
test:
  image:
    repository: curlimages/curl
    tag: 8.17.0
    digest: ""

# Pulp serves repository content for Katello. It runs as three Deployments
# (api, content, worker) that share one content volume, plus a migration Job
# that runs before every install and upgrade. Settings that are not secret are
# rendered into /etc/pulp/settings.py; credentials come from existingSecret.
pulp:
  enabled: false
  image:
    repository: quay.io/foreman/pulp
    tag: foreman-nightly
    digest: ""
    pullPolicy: IfNotPresent
  # Secret in the release namespace with the keys named below.
  existingSecret: pulp-runtime
  databasePasswordSecretKey: DATABASE_PASSWORD
  # Django SECRET_KEY.
  secretKeySecretKey: SECRET_KEY
  # Valkey or Redis URL, for example redis://valkey:6379/8.
  redisUrlSecretKey: REDIS_URL
  # Fernet key Pulp uses to encrypt database fields, created with
  # `openssl rand -base64 32 | tr '+/' '-_'`. Keep it: data encrypted with a
  # lost key cannot be read.
  symmetricKeySecretKey: database_fields.symmetric.key
  database:
    host: postgresql
    port: 5432
    name: pulp
    user: pulp
    sslMode: disable
  settings:
    # Base URL that Pulp publishes for content, used by hosts to download
    # packages. Default https://<foreman.fqdn>.
    contentOrigin: ""
    # Pulp API URL that Pulp advertises to Foreman as a Smart Proxy feature.
    # Katello sends its API calls there. Default https://<foreman.fqdn>.
    smartProxyPulpUrl: ""
    enabledPlugins:
      - pulp_certguard
      - pulp_file
      - pulp_smart_proxy
      - pulp_container
      - pulp_rpm
    # Pulp trusts the user name in this WSGI variable. HTTP_REMOTE_USER is the
    # REMOTE-USER request header, which a front door sets after it verified
    # the client certificate. Pulp accepts no passwords.
    remoteUserEnvironName: HTTP_REMOTE_USER
    logLevel: info
    # Extra Python appended to settings.py, for example
    # "ALLOWED_EXPORT_PATHS = ['/var/lib/pulp/exports']". No secrets here.
    extra: ""
  api:
    replicas: 1
    # Gunicorn worker processes per pod.
    workers: 2
    resources:
      requests:
        cpu: 100m
        memory: 384Mi
      limits:
        memory: 1Gi
    # Only pods that match this selector, in the release namespace and with
    # the release instance label, may connect to the API. Pulp trusts the
    # REMOTE-USER header, so a client that reaches the API directly could
    # claim any user. Takes effect only where the network plugin enforces
    # NetworkPolicy. Until a pod with these labels exists, nothing can reach
    # the API. Anyone who can create pods in the namespace can add the labels.
    networkPolicy:
      enabled: true
      clientPodLabels:
        app.kubernetes.io/component: httpd
  content:
    replicas: 1
    workers: 2
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
  worker:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 2Gi
  migration:
    backoffLimit: 2
    activeDeadlineSeconds: 1200
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
  # Containers, volumes, volume mounts and environment variables added to the
  # Pulp API, content and worker pods and to the migration Job.
  extraInitContainers: []
  extraVolumes: []
  extraVolumeMounts: []
  extraEnv: []
  storage:
    # Where Pulp keeps repository content: filesystem or s3. filesystem uses a
    # PersistentVolumeClaim mounted at /var/lib/pulp by every Pulp pod. s3 uses
    # a bucket in S3 or an S3-compatible object store (settings under s3), and
    # each Pulp pod gets an emptyDir at /var/lib/pulp for temporary files. The
    # Pulp image must contain django-storages and boto3 for s3.
    type: filesystem
    s3:
      # Required with type s3.
      bucket: ""
      # Leave empty for AWS S3. For other object stores the full URL, for
      # example https://s3.example.com.
      endpointUrl: ""
      region: ""
      # path, virtual or empty for the boto3 default. S3-compatible stores
      # often need path.
      addressingStyle: ""
      signatureVersion: s3v4
      # Secret in the release namespace with the access key and secret key.
      # Leave empty when the pods get credentials another way, for example
      # from workload identity.
      existingSecret: ""
      accessKeySecretKey: AWS_ACCESS_KEY_ID
      secretKeySecretKey: AWS_SECRET_ACCESS_KEY
      # Secret with the CA bundle that signed the endpoint certificate. Empty
      # uses the CA bundle of the Pulp image.
      caSecret:
        name: ""
        key: ca.crt
      # Set false to skip TLS verification of the endpoint. Only for tests.
      verify: true
      # The content app serves every file itself, so the bucket stays
      # private and every download passes Pulp's entitlement check. Set
      # true to answer with a redirect to a signed bucket URL instead:
      # clients must then reach and trust the endpoint, and anyone with
      # the URL can download the file until the signature expires.
      redirectToObjectStorage: false
      # More django-storages S3 options, for example {"location": "pulp"}.
      # Not for credentials (access_key, secret_key, security_token,
      # session_token, session_profile): they would land in a ConfigMap, so
      # the chart rejects them. Use existingSecret.
      options: {}
    # The settings below apply to type filesystem only.
    # With existingClaim set, the chart creates no claim.
    existingClaim: ""
    size: 10Gi
    # Empty uses the cluster default StorageClass.
    storageClass: ""
    accessMode: ReadWriteOnce
    # Schedule content and worker pods on the node of a Pulp API pod, so they
    # can share a ReadWriteOnce volume. Set false with ReadWriteMany storage.
    colocate: true

# Katello adds content and subscription management to Foreman. It needs
# dynflow, pulp, candlepin, certificates and httpd enabled, and an https
# foreman.externalUrl. Katello reaches Candlepin at
# https://<fullname>-candlepin:23443/candlepin with the OAuth secret from
# candlepin.existingSecret, and trusts it through the certificates.ca bundle,
# which must also hold the CA that signs Candlepin consumer certificates.
katello:
  enabled: false
  # Seconds Katello waits for a Candlepin or Pulp API response.
  restClientTimeout: 3600
  # After every install and upgrade a Job registers Pulp in Foreman as a Smart
  # Proxy with the Pulpcore feature. Katello then uses the Pulp API URL that
  # Pulp advertises (pulp.settings.smartProxyPulpUrl).
  pulpSmartProxy:
    # Default <foreman.fqdn>-pulp.
    name: ""
    # Pulp's Smart Proxy API through httpd, reachable from the Foreman pods.
    # Default https://<fullname>-httpd.<namespace>.svc/pulp/api/v3/smart_proxy.
    url: ""
    backoffLimit: 6
    activeDeadlineSeconds: 900
