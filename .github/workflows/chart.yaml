name: Chart checks

on:
  pull_request:
  push:
    branches:
      - develop

# A newer push to the same branch or PR cancels an in-progress run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Decide whether the heavy Kind suite needs to run. It runs only for pull
  # requests that touch chart or test code; a push to develop (for example the
  # merge of an already-tested PR) and doc-only changes run lint + static only.
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      charts: ${{ steps.filter.outputs.charts }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: filter
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          # No usable base (first push, force-push, new branch): run the suite.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "charts=true" >> "$GITHUB_OUTPUT"
            echo "No usable base commit; running the full suite."
            exit 0
          fi
          if git diff --name-only "$base" "$head" \
               | grep -qE '^(charts/|tests/|Makefile|\.github/workflows/(tests|chart)\.yaml)'; then
            echo "charts=true" >> "$GITHUB_OUTPUT"
          else
            echo "charts=false" >> "$GITHUB_OUTPUT"
            echo "No chart/test changes; running lint + static only."
          fi

  test:
    name: Tests
    needs: changes
    uses: ./.github/workflows/tests.yaml
    with:
      # Heavy integration jobs: pull requests that changed chart/test code only.
      integration: ${{ github.event_name == 'pull_request' && needs.changes.outputs.charts == 'true' }}
